<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>性欲指示器 / Desire Indicator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="description" content="本地化自我状态记录工具">
  <meta name="theme-color" content="#0a0a1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f0ff" media="(prefers-color-scheme: light)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>(function(){try{var d=localStorage.getItem('desire-indicator');var m=d?JSON.parse(d).themeMode:'auto';var t=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}})();</script>
</head>
<body>
  <div class="app">
    <div class="bg-canvas">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
    </div>

    <div id="dashboard" class="view active">
      <header class="view-header">
        <div class="header-content">
          <h1>性欲指示器</h1>
          <p class="subtitle">通过滑块记录当前状态，并生成简短结论</p>
        </div>
        <button class="btn btn-icon" id="goSettings" aria-label="设置">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </header>

      <div class="sliders-area" id="slidersArea">
        <div class="sliders-list" id="slidersList"></div>
      </div>

      <div class="conclusion-area" id="conclusionArea" style="display:none;">
        <div class="glass-card conclusion-card">
          <div class="conclusion-label">当前结论</div>
          <p class="conclusion-text" id="conclusionText"></p>
          <button class="btn btn-sm btn-glass" id="copyBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            复制
          </button>
        </div>
      </div>

      <div class="bottom-actions">
        <button class="btn btn-primary btn-lg" id="generateBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          生成结论
        </button>
      </div>
    </div>

    <div id="settings" class="view">
      <header class="view-header">
        <button class="btn btn-back" id="goDashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          返回
        </button>
        <h1>设置</h1>
      </header>

      <div class="settings-body">
        <section class="glass-card settings-section">
          <h2 class="section-title">主题模式</h2>
          <div class="theme-switcher" id="themeSwitcher">
            <button class="theme-option" data-theme="light">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              浅色
            </button>
            <button class="theme-option" data-theme="dark">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              深色
            </button>
            <button class="theme-option" data-theme="auto">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              自动
            </button>
          </div>
        </section>

        <section class="glass-card settings-section">
          <div class="section-header">
            <h2 class="section-title">滑块管理</h2>
            <button class="btn btn-sm btn-glass" id="addSliderBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              添加
            </button>
          </div>
          <div class="slider-list" id="settingsSliderList"></div>
        </section>

        <section class="glass-card settings-section">
          <h2 class="section-title">AI 评语</h2>
          <p class="section-desc">配置后生成结论时将由 AI 撰写评语。API Key 仅存储在本地浏览器，不会泄露到任何外部服务。</p>
          <div class="llm-config">
            <div class="form-group">
              <label>API 地址</label>
              <input type="url" id="llmApiUrl" class="form-input" placeholder="https://api.openai.com/v1/chat/completions">
            </div>
            <div class="form-group">
              <label>API Key</label>
              <input type="password" id="llmApiKey" class="form-input" placeholder="sk-...">
            </div>
            <div class="form-group">
              <label>模型</label>
              <input type="text" id="llmModel" class="form-input" placeholder="gpt-4o-mini">
            </div>
          </div>
        </section>

        <section class="glass-card settings-section">
          <h2 class="section-title">数据管理</h2>
          <div class="data-actions">
            <button class="btn btn-glass" id="exportBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              导出配置
            </button>
            <button class="btn btn-glass" id="importBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              导入配置
            </button>
            <button class="btn btn-danger-outline" id="resetBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
              重置配置
            </button>
          </div>
          <input type="file" id="importFile" accept=".json" hidden>
        </section>
      </div>
    </div>

    <div id="sliderModal" class="modal-overlay" style="display:none;">
      <div class="modal glass-card">
        <div class="modal-header">
          <h2 id="modalTitle">编辑滑块</h2>
          <button class="btn btn-icon modal-close" id="modalClose" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>名称</label>
            <input type="text" id="sliderName" class="form-input" placeholder="例如：性欲" maxlength="20">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>最小值</label>
              <input type="number" id="sliderMin" class="form-input" value="0">
            </div>
            <div class="form-group">
              <label>最大值</label>
              <input type="number" id="sliderMax" class="form-input" value="100">
            </div>
            <div class="form-group">
              <label>默认值</label>
              <input type="number" id="sliderDefault" class="form-input" value="50">
            </div>
          </div>
          <div class="form-group">
            <div class="section-header">
              <label>区间规则</label>
              <button class="btn btn-xs btn-glass" id="addRangeBtn">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                添加区间
              </button>
            </div>
            <div id="rangesContainer" class="ranges-container"></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-glass" id="modalCancel">取消</button>
          <button class="btn btn-primary" id="modalSave">保存</button>
        </div>
      </div>
    </div>

    <div id="confirmOverlay" class="modal-overlay" style="display:none;">
      <div class="modal glass-card confirm-dialog">
        <h3 id="confirmTitle">确认操作</h3>
        <p id="confirmMessage"></p>
        <div class="modal-footer">
          <button class="btn btn-glass" id="confirmCancel">取消</button>
          <button class="btn btn-danger" id="confirmOk">确认</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <footer class="app-footer">
    <p>本工具仅用于个人状态记录与表达，不构成医学、心理或关系建议。</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
